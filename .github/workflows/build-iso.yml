name: Build bootable ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install current Debian Live Build
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap gettext git make po4a
          git clone --depth 1 https://salsa.debian.org/live-team/live-build.git /tmp/live-build
          sudo make -C /tmp/live-build install
      - name: Build hybrid USB/DVD image
        run: sudo bash ./image/build-iso.sh
      - name: Create checksum
        run: sha256sum reviveai-amd64.iso > reviveai-amd64.iso.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: reviveai-amd64
          path: |
            reviveai-amd64.iso
            reviveai-amd64.iso.sha256
      - name: Attach image to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            reviveai-amd64.iso
            reviveai-amd64.iso.sha256
